<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnySender 控制台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo-dot"></span>
      <h1>AnySender</h1>
    </div>
    <div class="topbar-status">
      <div class="status-pill pill-ok" id="statusPill">
        <span class="dot"></span>
        <span id="statusText">运行中</span>
        <span class="sep">·</span>
        <span id="jobCount">0</span> 调度
        <span class="sep">·</span>
        <span id="runningCount">0</span> 运行中
        <span class="sep">·</span>
        <span id="pluginCount">0</span> 插件
      </div>
      <div class="next-run">下次：<span id="nextRun">—</span></div>
    </div>
  </header>

  <main class="layout">
    <section class="panel tasks-panel">
      <div class="panel-head">
        <h2>任务列表</h2>
        <button class="btn btn-primary" id="btnNew">+ 新建任务</button>
      </div>
      <div class="task-list" id="taskList"></div>
    </section>

    <aside class="panel log-panel">
      <div class="panel-head">
        <h2>实时日志</h2>
        <button class="btn btn-ghost" id="btnClearLog">清空</button>
      </div>
      <div class="log-box" id="logBox"></div>
    </aside>
  </main>
</div>

<!-- 任务编辑弹窗 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">新建任务</h3>
      <button class="btn-icon" id="btnCloseModal">×</button>
    </div>
    <form id="taskForm">
      <input type="hidden" id="f_oldName">
      <label>任务名
        <input type="text" id="f_name" placeholder="如：早报发送" required>
      </label>
      <label>插件
        <select id="f_plugin">
          <option value="qq">qq</option>
          <option value="wechat">wechat</option>
          <option value="dingtalk">dingtalk</option>
          <option value="feishu">feishu</option>
        </select>
      </label>
      <label>群名 / 联系人
        <input type="text" id="f_group" placeholder="如：工作群" required>
      </label>
      <label>Cron 表达式（秒 分 时 日 月 周）
        <input type="text" id="f_schedule" placeholder="0 30 8 * * *">
      </label>
      <label>消息内容（纯文本）
        <input type="text" id="f_message" placeholder="发送的文本，可与图片二选一">
      </label>
      <label>图片路径（每行一个，可留空）
        <textarea id="f_images" rows="3" placeholder="E:/images/a.png"></textarea>
      </label>
      <p class="form-hint">消息与图片至少填一项；不填图片即纯文本发送。</p>
      <div class="switch-row">
        <label class="switch-label">启用
          <input type="checkbox" id="f_enabled" checked>
          <span class="switch"></span>
        </label>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="btnCancel">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
